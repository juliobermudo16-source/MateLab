name: Compilar APK de MateLab

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + Lint + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      # El repositorio no incluye gradle-wrapper.jar (binario). Se genera aqui
      # para que ./gradlew funcione igual en CI y en la maquina del usuario.
      - name: Generar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x ./gradlew

      - name: Limpiar
        run: ./gradlew clean --no-daemon

      - name: Pruebas unitarias
        id: tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Analisis estatico (lint)
        if: always()
        run: ./gradlew lintDebug --no-daemon

      - name: Compilar APK de depuracion
        run: ./gradlew assembleDebug --no-daemon

      - name: Compilar APK de produccion
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK y calcular SHA-256
        id: apk
        run: |
          mkdir -p deliverables
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/[^"]*"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "deliverables/MateLab-v$VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "deliverables/MateLab-v$VERSION-release.apk"
          {
            echo "# MateLab - Resultados reales de compilacion"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Fecha (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Version: $VERSION"
            echo
            echo "## SHA-256"
            echo '```'
            sha256sum deliverables/*.apk
            echo '```'
            echo
            echo "## Tamano de los APK"
            echo '```'
            ls -lh deliverables/*.apk | awk '{print $9, $5}'
            echo '```'
          } > deliverables/BUILD_RESULT.md
          cat deliverables/BUILD_RESULT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MateLab-APK-v${{ steps.apk.outputs.version }}
          path: |
            deliverables/*.apk
            deliverables/BUILD_RESULT.md
          if-no-files-found: error
          retention-days: 90

      - name: Publicar informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MateLab-informes
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

      - name: Crear Release con el APK (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deliverables/*.apk
            deliverables/BUILD_RESULT.md
          generate_release_notes: true
